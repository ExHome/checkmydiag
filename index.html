<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Le nom, la signature, puis ce que le produit fait. Ce dernier morceau
         n'est pas décoratif : « diagnostic immobilier » est le seul mot que
         quelqu'un tapera pour trouver ce site, et « Verrière » ne le remplace
         pas — c'est un nom neuf que personne ne cherche encore. -->
    <title>Verrière — La lumière sur vos diagnostics immobiliers</title>
    <meta
      name="description"
      content="Déposez votre rapport de diagnostic immobilier (DPE, électricité, amiante, plomb, gaz, termites…) : il devient cliquable. Chaque ligne s’explique en clair, avec un schéma. Votre document ne quitte jamais votre appareil."
    />
    <!-- Pas d'indexation tant que la société qui édite le site est en cours de
         création : sans éditeur identifiable ni conditions opposables, un
         service qui commente des documents réglementaires n'a pas à être
         référencé. Le site reste entièrement accessible ; seuls les robots
         sont écartés. À retirer le jour de l'immatriculation, en même temps
         que EDITEUR_CONNU dans src/lib/nuls/rendu.ts. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Le vert profond de la charte, et non le bleu pétrole qui traînait ici :
         cette couleur teinte la barre du navigateur sur mobile, c'est-à-dire le
         premier centimètre de Verrière qu'on voit sur un téléphone. Le pétrole
         est retiré du produit depuis le 19/08 — un test l'interdit dans le
         code, il restait dans cette page. -->
    <meta name="theme-color" content="#0a2b23" />
    <!-- Le vrai logo remplace l'emoji de chantier. Les favicons ne montrent que
         quatre carreaux : sous 28 px, la grille de six sature et devient une
         tache. La charte dit que cette simplification est volontaire. -->
    <link rel="icon" href="./logo/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./logo/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./logo/favicon-16.png" />
    <link rel="apple-touch-icon" href="./logo/icone-180.png" />
    <!--
      Ajouté à l'écran d'accueil, le site devient une application.

      Sur iPhone, ces trois lignes changent tout : l'app s'ouvre en plein écran
      sans barre d'adresse, la zone d'état prend le vert de la marque, et le nom
      sous l'icône est « Verrière » — pas le titre complet, qui serait tronqué
      en « Verrière — La lumière su… ».

      Le manifeste, lui, est ce qu'Android attend pour proposer l'installation :
      sans lui, il n'offre rien du tout.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Verrière" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <div id="app"></div>
    <!--
      L'analyse d'un PDF se fait dans le navigateur : sans JavaScript, il n'y a
      rien à afficher. Plutôt qu'une page blanche, on donne la sortie utile —
      les explications, qui sont, elles, de vraies pages HTML.
    -->
    <noscript>
      <h1>Verrière — La lumière sur vos diagnostics</h1>
      <p>
        Cet outil lit votre rapport de diagnostic immobilier directement dans votre navigateur :
        il a besoin de JavaScript pour fonctionner, et c’est ce qui garantit que votre document
        ne part sur aucun serveur.
      </p>
      <p>
        Pour comprendre les diagnostics sans déposer de fichier :
        <a href="./en-clair/">En clair</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
