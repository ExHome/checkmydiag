<!doctype html><meta charset="utf-8"><style>

</style><div class="row" id="r"></div><div class="row" id="r2"></div>
<script>
const data={"electricite":"<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"#F7F6F2\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M 68.5 20.3 A 35 35 0 0 1 51.2 85\" />\n  <path d=\"M 31.5 79.7 A 35 35 0 0 1 48.8 15\" />\n  <path d=\"M 55.5 29 L 34.5 54.5 L 46.5 54.5 L 44.5 71 L 65.5 45.5 L 53.5 45.5 Z\" fill=\"#F7F6F2\" />\n</svg>\n","amiante":"<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"#F7F6F2\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M 50 16 L 79.4 33 L 79.4 67 L 50 84 L 20.6 67 L 20.6 33 Z\" />\n  <circle cx=\"50\" cy=\"50\" r=\"14\" />\n  <path d=\"M 64 36 L 64 64\" />\n</svg>\n","gaz":"<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"#F7F6F2\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M 50 15 C 56 31 71 42 73 56 C 75 72 64 85 50 85 C 36 85 25 72 27 56 C 29 42 44 31 50 15 Z\" />\n  <path d=\"M 50 45 C 53 53 60 58 60 64 C 60 69 56 72 50 72 C 44 72 40 69 40 64 C 40 58 47 53 50 45 Z\" />\n</svg>\n","plomb":"<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"#F7F6F2\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <circle cx=\"50\" cy=\"50\" r=\"35\" />\n  <path d=\"M 32 36 V 64\" />\n  <path d=\"M 32 36 H 36 A 8 8 0 0 1 36 52 H 32\" />\n  <path d=\"M 56 32 V 64\" />\n  <path d=\"M 56 48 H 60 A 8 8 0 0 1 60 64 H 56\" />\n</svg>\n","dpe":"<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"#F7F6F2\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M 50 15 L 85 42 L 85 85 L 15 85 L 15 42 Z\" />\n  <path d=\"M 30 52 L 46 52\" />\n  <path d=\"M 30 63 L 58 63\" />\n  <path d=\"M 30 74 L 70 74\" />\n</svg>\n","carrez":"<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" fill= const names=["electricite","amiante","gaz","plomb","dpe","carrez"];
function draw(name,px,zoom,host){
  const c=document.createElement('canvas');
  c.width=px*zoom;c.height=px*zoom;
  const x=c.getContext('2d');
  const off=document.createElement('canvas');off.width=px;off.height=px;
  const o=off.getContext('2d');
  const g=o.createLinearGradient(0,0,px,px);g.addColorStop(0,'#F2A33C');g.addColorStop(1,'#E0651F');
  o.fillStyle=g;o.beginPath();o.roundRect(0,0,px,px,px*0.22);o.fill();
  const img=new Image();
  img.onload=()=>{
    const s=Math.round(px*0.64);
    o.drawImage(img,Math.round((px-s)/2),Math.round((px-s)/2),s,s);
    x.imageSmoothingEnabled=false;
    x.drawImage(off,0,0,px,px,0,0,px*zoom,px*zoom);
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(data[name]);
  host.appendChild(c);
}
const r=document.getElementById('r');
[[28,10],[28,6],[36,8],[22,10]].forEach(([p,z])=>draw('electricite',p,z,r));
const r2=document.getElementById('r2');
names.forEach(n=>draw(n,28,6,r2));
</script>
