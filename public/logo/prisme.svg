<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 112" role="img" aria-label="Verrière">
  <title>Verrière</title>
  <defs>
    <linearGradient id="l0" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#2f8f43"/><stop offset="1" stop-color="#4caf3d"/></linearGradient>
    <linearGradient id="l1" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#4caf3d"/><stop offset="1" stop-color="#7cc23a"/></linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#7cc23a"/><stop offset="1" stop-color="#c3d438"/></linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#c3d438"/><stop offset="1" stop-color="#fbd232"/></linearGradient>
    <linearGradient id="l4" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#fbd232"/><stop offset="1" stop-color="#f28c28"/></linearGradient>
    <linearGradient id="l5" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#f28c28"/><stop offset="1" stop-color="#e53935"/></linearGradient>
    <!-- La moitié pleine n'est pas un aplat : elle a une facette éclairée. -->
    <linearGradient id="plein" x1="0.15" y1="0" x2="0.9" y2="0.85">
      <stop offset="0" stop-color="#15503f"/>
      <stop offset="0.55" stop-color="#0d3b2f"/>
      <stop offset="1" stop-color="#05201a"/>
    </linearGradient>
    <!-- Le fuseau : une tranche de verre, pas un trait. -->
    <linearGradient id="tranche" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd8d0"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ec"/>
    </linearGradient>
    <filter id="ombre" x="-30%" y="-20%" width="170%" height="150%">
      <feDropShadow dx="1.6" dy="2.4" stdDeviation="2.6" flood-color="#041914" flood-opacity=".45"/>
    </filter>
  </defs>

  <g filter="url(#ombre)">
    <!-- L'information avant qu'on la regarde : opaque, dense. -->
    <path d="M50.0 4.0L4.0 54.0L50.0 104.0Z" fill="url(#plein)"/>
    <!-- La lumiere decomposee : six lames convergeant vers la pointe.

       Les six teintes sont interpolees sur les QUATRE couleurs spectrales de la
       palette officielle : vert #4CAF3D, jaune #FBD232, orange #F28C28, rouge
       #E53935. Le spectre va donc du vert au rouge, comme l'etiquette DPE dont
       ce prisme est l'embleme.

       Il commencait par un turquoise #1fb4b8 qui n'appartient a aucune charte
       Verriere, et finissait a l'orange sans jamais atteindre le rouge. Le
       logo en sortait froid et delave, la ou le brand board le montre
       eclatant. -->
    <path d="M50.0 4.0L96.0 54.0L50.0 25.7Z" fill="url(#l0)"/><!-- turquoise -->
    <path d="M50.0 25.7L96.0 54.0L50.0 41.0Z" fill="url(#l1)"/><!-- vert d’eau -->
    <path d="M50.0 41.0L96.0 54.0L50.0 54.0Z" fill="url(#l2)"/><!-- vert -->
    <path d="M50.0 54.0L96.0 54.0L50.0 67.0Z" fill="url(#l3)"/><!-- chartreuse -->
    <path d="M50.0 67.0L96.0 54.0L50.0 82.3Z" fill="url(#l4)"/><!-- jaune -->
    <path d="M50.0 82.3L96.0 54.0L50.0 104.0Z" fill="url(#l5)"/><!-- orange -->
    <!-- Le joint sombre entre les lames : sans lui, c'est un dégradé, pas un prisme. -->
    <path d="M50.0 25.7L96.0 54.0" stroke="#07231c" stroke-width="1.4" stroke-linecap="round" opacity=".85"/>
    <path d="M50.0 41.0L96.0 54.0" stroke="#07231c" stroke-width="1.4" stroke-linecap="round" opacity=".85"/>
    <path d="M50.0 54.0L96.0 54.0" stroke="#07231c" stroke-width="1.4" stroke-linecap="round" opacity=".85"/>
    <path d="M50.0 67.0L96.0 54.0" stroke="#07231c" stroke-width="1.4" stroke-linecap="round" opacity=".85"/>
    <path d="M50.0 82.3L96.0 54.0" stroke="#07231c" stroke-width="1.4" stroke-linecap="round" opacity=".85"/>
    <!-- La tranche, là où la lumière entre. -->
    <path d="M50.0 4.0C46.6 34.0 46.6 74.0 50.0 104.0C53.4 74.0 53.4 34.0 50.0 4.0Z" fill="url(#tranche)"/>
    <!-- L'arête vive, en haut à gauche : c'est elle qui donne le volume. -->
    <path d="M50.0 4.0L4.0 54.0" fill="none" stroke="#8fb9a4" stroke-width="1.3" stroke-linecap="round" opacity=".55"/>
    <path d="M4.0 54.0L50.0 104.0" fill="none" stroke="#0a2b23" stroke-width="1.1" stroke-linecap="round" opacity=".5"/>
  </g>
</svg>
