name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Le test sur rapports réels se saute tout seul : les PDF ne sont pas
      # dans le dépôt.
      - run: npm test
      - run: npm run check
      # L'état du référencement, imprimé à chaque passage : couverture des
      # intentions, pages à revérifier, trous à combler. Informatif — il ne fait
      # pas échouer la construction, il donne à lire.
      - run: npm run seo
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # LE SITE EST ROUVERT — décision d'Aude, 21/08/2026.
  #
  # L'application est de nouveau construite et publiée. La page de chantier
  # reste dans le dépôt (`chantier/index.html`) : pour refermer le site, il
  # suffit de remettre l'assemblage de cette page à la place du build, et
  # `path: chantier` à la place de `path: dist`.
  #
  # L'ATELIER n'est jamais concerné, ni ouvert ni fermé : il n'entre pas dans
  # un build public — garde `VITE_ATELIER`, tenue par
  # `src/lib/atelier/hors-bundle.test.ts`, qui échoue si un import statique
  # revient. Rouvrir le site ne l'expose donc pas.
  # ─────────────────────────────────────────────────────────────────────────
  deploiement:
    needs: controle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Le titre des cartes de partage vient de la police du dépôt, mais leurs
      # mentions sont dans la linéale du système. Sans police installée, elles
      # ne seraient pas dessinées du tout.
      - run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      # L'adresse du site sert aux liens canoniques, aux données structurées et
      # au sitemap. Sans elle, le build retombe sur le domaine d'exemple écrit
      # dans rendu.ts, et chaque page publiée déclarerait que la « vraie »
      # version se trouve ailleurs — pire que pas de canonique du tout.
      # Le jour où un domaine propre sera branché, c'est ici qu'on le change.
      #
      # `npm run build` — et surtout PAS `npm run atelier` : c'est ce qui garde
      # l'atelier hors du site public.
      - run: npm run build
        env:
          CMD_SITE: https://exhome.github.io/checkmydiag
      # enablement : le workflow allume GitHub Pages lui-même au premier
      # passage. Sans ça, il faut d'abord cocher « Source : GitHub Actions »
      # dans les réglages — un geste de plus, à faire sous le compte
      # propriétaire, et qui retarde la première mise en ligne.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4
