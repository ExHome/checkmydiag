name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Le test sur rapports réels se saute tout seul : les PDF ne sont pas
      # dans le dépôt.
      - run: npm test
      - run: npm run check
      # L'état du référencement, imprimé à chaque passage : couverture des
      # intentions, pages à revérifier, trous à combler. Informatif — il ne fait
      # pas échouer la construction, il donne à lire.
      - run: npm run seo
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # LE SITE EST EN CONSTRUCTION — décision d'Aude, 21/08/2026.
  #
  # Ce qui est publié n'est plus l'application, mais la seule page
  # `chantier/index.html`. Ce n'est pas un écran posé devant un site qui
  # tournerait encore : l'application n'est pas construite ici, donc son code
  # n'est pas déployé et il n'y a rien à explorer derrière la page.
  #
  # L'ATELIER, lui, n'est jamais concerné : il n'entre même pas dans un build
  # public (garde `VITE_ATELIER`, tenue par `src/lib/atelier/hors-bundle.test.ts`),
  # et il vit derrière son propre portail — voir `docs/ATELIER-EN-LIGNE.md`.
  #
  # Le contrôle ci-dessus continue de tourner sur l'application entière : le
  # chantier ne met pas les tests en pause.
  #
  # Pour rouvrir le site le jour venu : rétablir `npm run build` et remettre
  # `path: dist`.
  # ─────────────────────────────────────────────────────────────────────────
  deploiement:
    needs: controle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pas de `npm ci`, pas de build : pendant le chantier, il n'y a rien à
      # construire. Une page, et les éléments de marque qu'elle affiche.
      #
      # Le prisme et les favicons sont COPIÉS depuis `public/logo/` plutôt que
      # dupliqués dans `chantier/` : le visuel de Verrière a une seule source,
      # et une copie dans le dépôt finirait par diverger de l'originale.
      - name: Assembler la page de chantier
        run: |
          mkdir -p _site/logo
          cp chantier/index.html _site/
          cp public/logo/prisme.svg public/logo/favicon.ico public/logo/favicon-32.png _site/logo/
      # enablement : le workflow allume GitHub Pages lui-même au premier
      # passage. Sans ça, il faut d'abord cocher « Source : GitHub Actions »
      # dans les réglages — un geste de plus, à faire sous le compte
      # propriétaire, et qui retarde la première mise en ligne.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4
