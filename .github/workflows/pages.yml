name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Le test sur rapports réels se saute tout seul : les PDF ne sont pas
      # dans le dépôt.
      - run: npm test
      - run: npm run check

  deploiement:
    needs: controle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Les cartes de partage sont rendues avec les polices du système. Sans
      # serif installé, leur titre tomberait sur une police de secours — ou ne
      # serait pas dessiné du tout.
      - run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: npm run build
      # enablement : le workflow allume GitHub Pages lui-même au premier
      # passage. Sans ça, il faut d'abord cocher « Source : GitHub Actions »
      # dans les réglages — un geste de plus, à faire sous le compte
      # propriétaire, et qui retarde la première mise en ligne.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4
